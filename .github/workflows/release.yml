name: Release userscript

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          # Full history and tags, so release notes can diff against the previous tag
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const expected = 'v' + require('./package.json').version;
          if (process.env.RELEASE_TAG !== expected) {
          throw new Error('Tag ' + process.env.RELEASE_TAG + ' does not match ' + expected);
          }"

      - name: Test and build userscript
        run: npm run check

      - name: Write release notes from commits
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md

      # --generate-notes is appended after the notes file and adds the Full Changelog link
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          "dist/anigamer_kits.user.js#AniGamerKit userscript"
          --verify-tag
          --notes-file release-notes.md
          --generate-notes
          --title "$RELEASE_TAG"
